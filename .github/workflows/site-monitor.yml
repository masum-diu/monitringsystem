# Schedule: 10:00 & 18:00 Asia/Dhaka (04:00 & 12:00 UTC)
#
# ONE secret: CRON_SECRET (same value as Vercel)
# Either:
#   A) Repository secrets → CRON_SECRET  (no environment: line needed), OR
#   B) Environment "Configure CRON_SECRET" → secret CRON_SECRET (configured below)

name: Site monitor

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

env:
  MONITOR_URL: https://monitringsystem-inks.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    environment: Configure CRON_SECRET
    steps:
      - name: Validate CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing CRON_SECRET. Add it under Environment 'Configure CRON_SECRET' OR Repository secrets. Value must match Vercel CRON_SECRET."
            exit 1
          fi

      - name: Run monitor and send email
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="${MONITOR_URL%/}"
          echo "GET ${BASE}/api/cron/monitor?force=1"
          HTTP=$(curl -sS -w "%{http_code}" -o /tmp/monitor-body.json \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/monitor?force=1")
          cat /tmp/monitor-body.json
          echo ""
          if [ "$HTTP" != "200" ]; then
            echo "::error::Monitor HTTP ${HTTP} — see JSON above (often Resend: verify domain for multiple recipients, or set MONITOR_EMAIL_FROM=onboarding@resend.dev on Vercel)"
            exit 1
          fi
