# Vercel Hobby: schedule via GitHub Actions (10:00 & 18:00 Asia/Dhaka).
#
# Settings → Secrets and variables → Actions → Repository secrets (NOT Environments):
#   MONITOR_URL  = https://monitringsystem-inks.vercel.app
#   CRON_SECRET  = same value as Vercel env CRON_SECRET

name: Site monitor

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      MONITOR_URL: ${{ secrets.MONITOR_URL }}
    steps:
      - name: Validate required secrets
        run: |
          set -euo pipefail
          if [ -z "${MONITOR_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Error: set Repository secrets MONITOR_URL and CRON_SECRET (Settings → Secrets and variables → Actions → Repository secrets)." >&2
            exit 1
          fi

      - name: Run monitor and send email
        run: |
          set -euo pipefail
          BASE="${MONITOR_URL%/}"
          case "$BASE" in
            http://*|https://*) ;;
            *) BASE="https://${BASE}" ;;
          esac
          HOST="$(echo "$BASE" | awk -F/ '{print $3}')"
          echo "Calling monitor endpoint on host: ${HOST}"
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/monitor?force=1"
