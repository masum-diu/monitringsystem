# Schedule: every 3 hours (UTC) — 8 checks/day
# Updates public/last-status.json on each run so the website shows last check time + results.

name: Site monitor

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  MONITOR_URL: https://monitringsystem-inks.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: Configure CRON_SECRET
    steps:
      - uses: actions/checkout@v4

      - name: Validate CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing CRON_SECRET (Environment Configure CRON_SECRET or Repository secret)."
            exit 1
          fi

      - name: Run monitor, email, save status JSON
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="${MONITOR_URL%/}"
          echo "GET ${BASE}/api/cron/monitor?force=1"
          HTTP=$(curl -sS -w "%{http_code}" -o public/last-status.json \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/monitor?force=1")
          cat public/last-status.json
          echo ""
          if [ "$HTTP" != "200" ]; then
            echo "::error::Monitor HTTP ${HTTP}"
            exit 1
          fi

      - name: Publish status to website (git push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/last-status.json
          git diff --staged --quiet && echo "No status change" && exit 0
          git commit -m "chore: update site monitor status"
          git push
