# Schedule: 10:00 & 18:00 Asia/Dhaka (04:00 & 12:00 UTC)
#
# ONE secret required:
#   Settings → Secrets and variables → Actions → Repository secrets → CRON_SECRET
#   (same value as Vercel env CRON_SECRET — NOT under Environments)

name: Site monitor

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

env:
  MONITOR_URL: https://monitringsystem-inks.vercel.app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Missing Repository secret CRON_SECRET. Go to Settings → Secrets and variables → Actions → Repository secrets (top tab, not Environments). Value must match Vercel CRON_SECRET."
            exit 1
          fi

      - name: Run monitor and send email
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="${MONITOR_URL%/}"
          echo "GET ${BASE}/api/cron/monitor?force=1"
          curl -fsS -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/cron/monitor?force=1"
